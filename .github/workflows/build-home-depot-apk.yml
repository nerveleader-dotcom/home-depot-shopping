
name: Build Home Depot APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ ! -d "$ANDROID_HOME" ]; then
            echo "Android SDK not found"
            exit 1
          fi
          ls "$ANDROID_HOME"

      - name: Extract Shopping Companion
        run: |
          mkdir -p android-project
          unzip -o shopping_companion_cart_parser_v5.zip -d android-project

      - name: Find Android project
        id: project
        shell: bash
        run: |
          BUILD_FILE=$(find android-project -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            echo "Android Gradle project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project directory: $PROJECT_DIR"

      - name: Fix product checklist and popup buttons
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          project = Path(os.environ["PROJECT_DIR"])

          # Fix hidden product checklist.
          java = project / "app/src/main/java/com/shoppingcompanion/homedepot/MainActivity.java"

          source = java.read_text()

          old_message = '.setMessage("Select ONLY the products in your Home Depot cart, not suggestions. You will confirm each quantity next. Your saved list is unchanged.")'

          if source.count(old_message) != 1:
              raise SystemExit("Product checklist patch target not found")

          source = source.replace(old_message, "", 1)
          source = source.replace(
              '.setTitle("Select actual cart products")',
              '.setTitle("Select ONLY actual cart products")',
              1
          )

          java.write_text(source)
          print("Product checklist fixed")

          # Fix HTML popup Close and X buttons.
          html = project / "app/src/main/assets/index.html"

          content = html.read_text()

          if content.count("function close()") != 1:
              raise SystemExit("Popup close function not found")

          content = content.replace(
              "close()",
              "dismissModal()"
          )

          if "function close()" in content:
              raise SystemExit("Old close function still exists")

          if content.count("function dismissModal()") != 1:
              raise SystemExit("New popup function missing")

          html.write_text(content)

          print("Popup buttons fixed")
          PY

      - name: Update app version to 0.3.4
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          build = Path(os.environ["PROJECT_DIR"]) / "app/build.gradle"
          text = build.read_text()

          if "versionCode 5" not in text:
              raise SystemExit("Expected versionCode 5 not found")

          if "versionName '0.3.2'" not in text:
              raise SystemExit("Expected versionName 0.3.2 not found")

          text = text.replace(
              "versionCode 5",
              "versionCode 7",
              1
          )
          text = text.replace(
              "versionName '0.3.2'",
              "versionName '0.3.4'",
              1
          )

          build.write_text(text)
          print("Version updated to 0.3.4")
          PY

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          gradle --no-daemon assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p apk-output

          find android-project -type f \
            -name "*debug.apk" \
            -exec cp {} apk-output/ \;

          if [ -z "$(ls -A apk-output)" ]; then
            echo "No debug APK generated"
            exit 1
          fi

          ls -lh apk-output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shopping-Companion-v0.3.4-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 30
          
