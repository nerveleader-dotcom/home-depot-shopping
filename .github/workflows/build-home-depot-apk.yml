
name: Build Home Depot APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract updated Shopping Companion
        run: |
          mkdir -p android-project
          unzip -o shopping_companion_home_depot_cart_update.zip -d android-project

      - name: Build Android APK
        working-directory: android-project
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shopping-Companion-Updated-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
