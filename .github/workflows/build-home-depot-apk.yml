
name: Build Home Depot APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"

      - name: Extract Shopping Companion
        run: |
          mkdir -p android-project
          unzip -o shopping_companion_cart_parser_v5.zip -d android-project

      - name: Find Android project
        id: project
        shell: bash
        run: |
          BUILD_FILE=$(find android-project -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            echo "Android project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Apply Shopping Companion fixes
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          project = Path(os.environ["PROJECT_DIR"])

          java = project / "app/src/main/java/com/shoppingcompanion/homedepot/MainActivity.java"
          source = java.read_text()

          old_message = '.setMessage("Select ONLY the products in your Home Depot cart, not suggestions. You will confirm each quantity next. Your saved list is unchanged.")'

          if source.count(old_message) != 1:
              raise SystemExit("Checklist patch target missing")

          source = source.replace(old_message, "", 1)
          source = source.replace(
              '.setTitle("Select actual cart products")',
              '.setTitle("Select ONLY actual cart products")',
              1
          )
          java.write_text(source)

          html = project / "app/src/main/assets/index.html"
          content = html.read_text()

          if content.count("function close()") != 1:
              raise SystemExit("Popup patch target missing")

          content = content.replace(
              "close()",
              "dismissModal()"
          )

          old_done = '${i.qty} collected</span>'
          old_button = '${i.qty}</button><button class="secondary" onclick="change('

          if content.count(old_done) != 1:
              raise SystemExit("Completed quantity target missing")

          if content.count(old_button) != 1:
              raise SystemExit("Quantity button target missing")

          content = content.replace(
              old_done,
              '${i.qty} of ${i.planned} collected</span>',
              1
          )

          content = content.replace(
              old_button,
              '${i.qty} of ${i.planned} collected</button><button class="secondary" onclick="change(',
              1
          )

          content = content.replace(
              '.qty{min-width:48px;',
              '.qty{min-width:128px;',
              1
          )

          html.write_text(content)
          print("Popup and quantity display fixes applied")
          PY

      - name: Update version to 0.3.5
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          build = Path(os.environ["PROJECT_DIR"]) / "app/build.gradle"
          content = build.read_text()

          if "versionCode 5" not in content:
              raise SystemExit("Expected base version missing")

          if "versionName '0.3.2'" not in content:
              raise SystemExit("Expected version name missing")

          content = content.replace(
              "versionCode 5",
              "versionCode 8",
              1
          )
          content = content.replace(
              "versionName '0.3.2'",
              "versionName '0.3.5'",
              1
          )

          build.write_text(content)
          PY

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          gradle --no-daemon assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p apk-output

          find android-project -type f \
            -name "*debug.apk" \
            -exec cp {} apk-output/ \;

          if [ -z "$(ls -A apk-output)" ]; then
            echo "No APK generated"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shopping-Companion-v0.3.5-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 30
          
