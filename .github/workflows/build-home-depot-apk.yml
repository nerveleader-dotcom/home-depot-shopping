
name: Build Home Depot APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ ! -d "$ANDROID_HOME" ]; then
            echo "Android SDK not found"
            exit 1
          fi
          ls "$ANDROID_HOME"

      - name: Extract corrected Shopping Companion
        run: |
          mkdir -p android-project
          unzip -o shopping_companion_cart_diagnostics_compile_fix.zip -d android-project

      - name: Find Android project
        id: project
        shell: bash
        run: |
          BUILD_FILE=$(find android-project -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            echo "Android Gradle project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project directory: $PROJECT_DIR"

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          gradle --no-daemon assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p apk-output

          find android-project -type f \
            -name "*debug.apk" \
            -exec cp {} apk-output/ \;

          if [ -z "$(ls -A apk-output)" ]; then
            echo "No debug APK was generated"
            exit 1
          fi

          ls -lh apk-output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shopping-Companion-Compile-Fix-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 30
