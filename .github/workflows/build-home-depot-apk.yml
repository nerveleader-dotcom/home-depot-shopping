
name: Build Home Depot APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ ! -d "$ANDROID_HOME" ]; then
            echo "Android SDK not found"
            exit 1
          fi
          ls "$ANDROID_HOME"

      - name: Extract Shopping Companion
        run: |
          mkdir -p android-project
          unzip -o shopping_companion_cart_parser_v5.zip -d android-project

      - name: Find Android project
        id: project
        shell: bash
        run: |
          BUILD_FILE=$(find android-project -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            echo "Android Gradle project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project directory: $PROJECT_DIR"

      - name: Fix manual product checklist
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          project = Path(os.environ["PROJECT_DIR"])
          java = project / "app/src/main/java/com/shoppingcompanion/homedepot/MainActivity.java"

          if not java.exists():
              raise SystemExit("MainActivity.java not found")

          source = java.read_text()

          old = '.setMessage("Select ONLY the products in your Home Depot cart, not suggestions. You will confirm each quantity next. Your saved list is unchanged.")'

          if source.count(old) != 1:
              raise SystemExit("Expected checklist dialog message not found exactly once")

          source = source.replace(old, "", 1)
          source = source.replace(
              '.setTitle("Select actual cart products")',
              '.setTitle("Select ONLY actual cart products")',
              1
          )

          java.write_text(source)
          print("Manual checklist dialog fixed")
          PY

      - name: Update app version
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          build = Path(os.environ["PROJECT_DIR"]) / "app/build.gradle"
          text = build.read_text()

          if "versionCode 5" not in text:
              raise SystemExit("Expected versionCode 5 not found")

          text = text.replace("versionCode 5", "versionCode 6", 1)
          text = text.replace(
              "versionName '0.3.2'",
              "versionName '0.3.3'",
              1
          )

          build.write_text(text)
          print("Updated Shopping Companion to v0.3.3")
          PY

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          gradle --no-daemon assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p apk-output

          find android-project -type f \
            -name "*debug.apk" \
            -exec cp {} apk-output/ \;

          if [ -z "$(ls -A apk-output)" ]; then
            echo "No debug APK was generated"
            exit 1
          fi

          ls -lh apk-output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shopping-Companion-v0.3.3-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 30
