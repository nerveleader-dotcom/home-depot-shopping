
name: Build Home Depot APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME"

      - name: Extract Shopping Companion
        run: |
          mkdir -p android-project
          unzip -o shopping_companion_cart_diagnostics_compile_fix.zip -d android-project

      - name: Find Android project
        id: project
        shell: bash
        run: |
          BUILD_FILE=$(find android-project -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            echo "Android project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project: $PROJECT_DIR"

      - name: Enable Java 17 compilation
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          project = Path(os.environ["PROJECT_DIR"])
          build = project / "app" / "build.gradle"

          if not build.exists():
              raise SystemExit("app/build.gradle not found")

          content = build.read_text()

          if "compileOptions" not in content:
              options = """
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          """
              start = content.find("android {")
              if start == -1:
                  raise SystemExit("android block not found")

              pos = start + len("android {")
              content = content[:pos] + "\n" + options + content[pos:]

          else:
              import re
              content = re.sub(
                  r'sourceCompatibility\s+\S+',
                  'sourceCompatibility JavaVersion.VERSION_17',
                  content
              )
              content = re.sub(
                  r'targetCompatibility\s+\S+',
                  'targetCompatibility JavaVersion.VERSION_17',
                  content
              )

          build.write_text(content)
          print(content)
          PY

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          gradle --no-daemon assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p apk-output

          find android-project -type f \
            -name "*debug.apk" \
            -exec cp {} apk-output/ \;

          if [ -z "$(ls -A apk-output)" ]; then
            echo "No APK generated"
            exit 1
          fi

          ls -lh apk-output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shopping-Companion-Java17-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 30
