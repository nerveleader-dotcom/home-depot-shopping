name: Build Home Depot APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-home-depot-apk.yml'
      - 'home_depot_android_android_build.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -o home_depot_android_android_build.zip -d .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix Android compatibility
        run: |
          sed -i -E 's/targetSdk(Version)?[[:space:]]*=?[[:space:]]*[0-9]+/targetSdk 35/g' app/build.gradle

      - name: Fix unresponsive pop-up buttons
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/assets/index.html")
          s = p.read_text()
          assert "function close()" in s, "Expected close function not found"
          s = s.replace("close()", "closeModal()")
          p.write_text(s)
          print("Fixed pop-up close function")
          PY

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: home-depot-shopping-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
